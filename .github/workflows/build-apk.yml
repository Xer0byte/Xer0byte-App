name: Build & Release Xer0byte APK and iOS Package

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK & Package iOS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Release Artifacts (APK & iOS Guide)
        run: |
          mkdir -p output_release
          cp app/build/outputs/apk/debug/app-debug.apk output_release/Xer0byte-Android.apk
          cp iOS_INSTALLATION_GUIDE.md output_release/Xer0byte-iOS-Guide.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Xer0byte-Release-Package
          path: output_release/*
          retention-days: 30

      - name: Publish Automated GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0-${{ github.run_number }}"
          name: "🚀 Xer0byte Release Build #${{ github.run_number }}"
          body: |
            # 🚀 Xer0byte — Offline Bluetooth Messenger
            **Organization:** Xer0byte  
            **Founder & Owner:** Ghaznain Ahmad  
            **Architecture:** 100% Offline Bluetooth RFCOMM Mesh (Zero Internet / SIM)

            ---
            ## ⬇️ Direct Download Links:

            ### 📱 For Android Users:
            - **[👉 CLICK HERE TO DOWNLOAD ANDROID APK (Xer0byte-Android.apk)](https://github.com/${{ github.repository }}/releases/download/v1.0-${{ github.run_number }}/Xer0byte-Android.apk)**

            ### 🍏 For iOS (iPhone & iPad) Users:
            - **[👉 CLICK HERE FOR iOS INSTALLATION GUIDE](https://github.com/${{ github.repository }}/releases/download/v1.0-${{ github.run_number }}/Xer0byte-iOS-Guide.txt)**
            - **[🌐 Instant Safari Live Web App](https://ais-pre-rwnp7qqnlqk43a6wrusrox-868695915078.asia-southeast1.run.app)** (Add to Home Screen)

            ---
            ### ✨ Features Included in this Build:
            - **Official Xer0byte Logo** launcher icon and top header branding
            - **Prominent Green Dots (`🟢`)** showing active peer-to-peer connection
            - **Multi-Peer Simultaneous Mesh**: Connect and talk to multiple phones at the same time
            - **WhatsApp User Interface**: 4 Tabs (Chats, Updates/Stories, Communities, Calls)
            - **Offline Media & Calling**: Voice notes with audio waveforms, photos, live locations, documents, and Bluetooth call screen
          files: |
            output_release/Xer0byte-Android.apk
            output_release/Xer0byte-iOS-Guide.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
