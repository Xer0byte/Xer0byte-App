name: Build & Release Xer0byte APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Easy Identification
        run: |
          mkdir -p output_apk
          cp app/build/outputs/apk/debug/app-debug.apk output_apk/Xer0byte-Bluetooth-Messenger.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xer0byte-Android-APK
          path: output_apk/Xer0byte-Bluetooth-Messenger.apk
          retention-days: 30

      - name: Create Automated GitHub Release with Direct APK Download Link
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: "v1.0-${{ github.run_number }}"
          name: "Xer0byte APK Build #${{ github.run_number }}"
          body: |
            ### 📱 Xer0byte — Offline Bluetooth Messenger
            **Organization:** Xer0byte
            **Founder & Owner:** Ghaznain Ahmad

            ---
            ### ⬇️ Direct Download Link:
            Click below to download and install the APK directly on your phone:
            - **[Download Xer0byte-Bluetooth-Messenger.apk](https://github.com/${{ github.repository }}/releases/download/v1.0-${{ github.run_number }}/Xer0byte-Bluetooth-Messenger.apk)**

            #### Features:
            - 100% Offline via Bluetooth RFCOMM Sockets (Zero Internet / SIM)
            - Latest WhatsApp user interface
            - Multi-peer concurrent mesh communication
            - Real-time online green dots
            - Voice notes, photos, documents, and Bluetooth calling
          files: output_apk/Xer0byte-Bluetooth-Messenger.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
